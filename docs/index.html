<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COVE — Creative Industry Platform</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         APP CONTAINER
    ========================== -->

    <div class="app">

        <!-- =========================
             TOP NAVIGATION
        ========================== -->

        <header class="top-nav">

            <div class="brand" id="brand">
                COVE
            </div>

            <nav class="main-navigation">

                <button
                    class="nav-item active"
                    data-page="insights"
                >
                    洞察
                </button>

                <button
                    class="nav-item"
                    data-page="inspiration"
                >
                    灵感
                </button>

                <button
                    class="nav-item"
                    data-page="jobs"
                >
                    职位
                </button>

            </nav>

            <button class="profile-button" id="profileButton">
                <span class="profile-icon"></span>
                <span>Profile</span>
            </button>

        </header>


        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main-content">

            <!-- =========================
                 INSIGHTS HOME
            ========================== -->

            <section
                class="page-section insights-page active-page"
                id="insightsPage"
            >

                <!-- SEARCH -->

                <div class="search-wrapper">

                    <div class="search-box">

                        <svg
                            class="search-icon"
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                        >
                            <circle cx="11" cy="11" r="7"></circle>

                            <line
                                x1="16.5"
                                y1="16.5"
                                x2="21"
                                y2="21"
                            ></line>
                        </svg>

                        <input
                            type="text"
                            id="searchInput"
                            maxlength="200"
                            aria-label="搜索知乎时尚趋势与经验"
                            placeholder="搜索时尚趋势与知识"
                            autocomplete="off"
                        >

                        <button
                            class="search-submit"
                            id="searchSubmit"
                            aria-label="搜索"
                        >

                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                            >
                                <line
                                    x1="5"
                                    y1="12"
                                    x2="19"
                                    y2="12"
                                ></line>

                                <polyline
                                    points="12 5 19 12 12 19"
                                ></polyline>
                            </svg>

                        </button>

                    </div>

                </div>


                <section id="zhihuResults" class="zhihu-results" hidden aria-label="知乎搜索结果">
                    <div class="results-heading"><h2>知乎 · 社区观点</h2><button id="clearZhihuSearch" type="button">返回趋势</button></div>
                    <p id="zhihuStatus" role="status" aria-live="polite"></p>
                    <div id="zhihuResultList" class="zhihu-result-list"></div>
                </section>

                <!-- TREND CARDS -->

                <div class="trend-section">

                    <div
                        class="trend-carousel"
                        id="trendCarousel"
                    >

                        <!-- CARD 1 -->

                        <article
                            class="trend-card"
                            data-id="trend-report"
                            data-keywords="2026趋势报告 趋势 时尚 行业"
                        >

                            <div class="card-visual visual-report">

                                <div class="visual-orbit"></div>

                                <div class="visual-orbit orbit-two"></div>

                                <div class="visual-glow"></div>

                            </div>

                            <div class="card-bottom">

                                <span class="card-title">
                                    2026趋势报告
                                </span>

                                <span class="card-arrow">
                                    →
                                </span>

                            </div>

                        </article>


                        <!-- CARD 2 -->

                        <article
                            class="trend-card"
                            data-id="ai-photography"
                            data-keywords="AI摄影 人工智能 摄影 工作流"
                        >

                            <div class="card-visual visual-ai">

                                <div class="lens-outer">

                                    <div class="lens-inner"></div>

                                    <div class="lens-core"></div>

                                </div>

                            </div>

                            <div class="card-bottom">

                                <span class="card-title">
                                    AI摄影
                                </span>

                                <span class="card-arrow">
                                    →
                                </span>

                            </div>

                        </article>


                        <!-- CARD 3 -->

                        <article
                            class="trend-card"
                            data-id="new-chinese"
                            data-keywords="新中式 东方 美学 中国 时尚"
                        >

                            <div class="card-visual visual-chinese">

                                <div class="branch branch-one"></div>

                                <div class="branch branch-two"></div>

                                <div class="flower flower-one"></div>

                                <div class="flower flower-two"></div>

                                <div class="flower flower-three"></div>

                            </div>

                            <div class="card-bottom">

                                <span class="card-title">
                                    新中式
                                </span>

                                <span class="card-arrow">
                                    →
                                </span>

                            </div>

                        </article>


                        <!-- CARD 4 -->

                        <article
                            class="trend-card"
                            data-id="street-fashion"
                            data-keywords="商业街拍 街拍 商业 摄影"
                        >

                            <div class="card-visual visual-street">

                                <div class="street-light light-one"></div>

                                <div class="street-light light-two"></div>

                                <div class="street-shadow"></div>

                                <div class="street-person"></div>

                            </div>

                            <div class="card-bottom">

                                <span class="card-title">
                                    商业街拍
                                </span>

                                <span class="card-arrow">
                                    →
                                </span>

                            </div>

                        </article>


                        <!-- CARD 5 -->

                        <article
                            class="trend-card"
                            data-id="quiet-luxury"
                            data-keywords="Quiet Luxury 极简 奢华 高级感"
                        >

                            <div class="card-visual visual-quiet">

                                <div class="fabric-shape fabric-one"></div>

                                <div class="fabric-shape fabric-two"></div>

                                <div class="fabric-shape fabric-three"></div>

                            </div>

                            <div class="card-bottom">

                                <span class="card-title">
                                    Quiet Luxury
                                </span>

                                <span class="card-arrow">
                                    →
                                </span>

                            </div>

                        </article>


                        <!-- CARD 6 -->

                        <article
                            class="trend-card"
                            data-id="brand-visual"
                            data-keywords="品牌视觉 品牌设计 视觉系统 广告"
                        >

                            <div class="card-visual visual-brand">

                                <div class="brand-line line-one"></div>

                                <div class="brand-line line-two"></div>

                                <div class="brand-line line-three"></div>

                            </div>

                            <div class="card-bottom">

                                <span class="card-title">
                                    品牌视觉
                                </span>

                                <span class="card-arrow">
                                    →
                                </span>

                            </div>

                        </article>

                    </div>

                </div>


                <!-- EMPTY SEARCH STATE -->

                <div
                    class="search-empty"
                    id="searchEmpty"
                >

                    <span class="empty-symbol">
                        ⌕
                    </span>

                    <p>
                        未找到相关趋势
                    </p>

                    <button id="resetSearch">
                        返回全部趋势
                    </button>

                </div>

            </section>


            <!-- =========================
                 INSPIRATION PAGE
            ========================== -->

            <section
                class="page-section inspiration-page"
                id="inspirationPage"
            >

                <div class="inspiration-shell">

                    <div class="inspiration-header">

                        <div>

                            <div class="page-label">
                                INSPIRATION
                            </div>

                            <h1>
                                灵感
                            </h1>

                        </div>

                        <button
                            class="publish-work-button"
                            id="publishWorkButton"
                        >
                            <span>
                                发布作品
                            </span>

                            <span>
                                ↗
                            </span>
                        </button>

                    </div>


                    <!-- PRIMARY FILTERS -->

                    <div
                        class="inspiration-filters"
                        aria-label="灵感分类"
                    >

                        <button
                            class="inspiration-filter active"
                            data-filter="recommended"
                        >
                            为你推荐
                        </button>

                        <button
                            class="inspiration-filter"
                            data-filter="latest"
                        >
                            最新
                        </button>

                        <button
                            class="inspiration-filter"
                            data-filter="editorial"
                        >
                            编辑精选
                        </button>

                        <button
                            class="inspiration-filter"
                            data-filter="摄影"
                        >
                            摄影
                        </button>

                        <button
                            class="inspiration-filter"
                            data-filter="造型"
                        >
                            造型
                        </button>

                        <button
                            class="inspiration-filter"
                            data-filter="妆发"
                        >
                            妆发
                        </button>

                        <button
                            class="inspiration-filter"
                            data-filter="品牌视觉"
                        >
                            品牌视觉
                        </button>

                        <button
                            class="inspiration-filter more-filter"
                            data-filter="more"
                            aria-expanded="false"
                            aria-controls="moreFilterPanel"
                        >

                            <span>
                                更多
                            </span>

                            <span class="filter-chevron">
                                ⌄
                            </span>

                        </button>

                    </div>


                    <!-- SECONDARY FILTERS -->

                    <div
                        class="more-filter-panel"
                        id="moreFilterPanel"
                        hidden
                    >

                        <button
                            class="sub-filter"
                            data-filter="AI 摄影"
                        >
                            AI 摄影
                        </button>

                        <button
                            class="sub-filter"
                            data-filter="新中式"
                        >
                            新中式
                        </button>

                        <button
                            class="sub-filter"
                            data-filter="商业街拍"
                        >
                            商业街拍
                        </button>

                        <button
                            class="sub-filter"
                            data-filter="Quiet Luxury"
                        >
                            Quiet Luxury
                        </button>

                        <button
                            class="sub-filter"
                            data-filter="Y2K"
                        >
                            Y2K
                        </button>

                        <button
                            class="sub-filter"
                            data-filter="未来复古"
                        >
                            未来复古
                        </button>

                    </div>


                    <!-- INSPIRATION MASONRY GRID -->

                    <div
                        class="inspiration-grid"
                        id="inspirationGrid"
                    >
                    </div>

                </div>

            </section>


            <!-- =========================
                 JOBS PAGE
            ========================== -->

            <section
                class="page-section secondary-page"
                id="jobsPage"
            >

                <div class="minimal-page-content">

                    <div class="page-label">
                        JOBS
                    </div>

                    <h1>
                        职位
                    </h1>

                    <div class="page-line"></div>

                </div>

            </section>


            <!-- =========================
                 PROFILE PANEL
            ========================== -->

            <aside
                class="profile-panel"
                id="profilePanel"
            >

                <div class="panel-header">

                    <span>
                        Profile
                    </span>

                    <button
                        class="panel-close"
                        id="profileClose"
                    >
                        ×
                    </button>

                </div>

                <div class="panel-body">

                    <div class="profile-placeholder">

                        <div class="profile-circle"></div>

                    </div>

                    <div class="profile-name">
                        COVE Member
                    </div>

                    <div class="profile-status">
                        Creative Industry Platform
                    </div>

                </div>

            </aside>


            <!-- =========================
                 TREND DETAIL PAGE
            ========================== -->

            <section
                class="trend-detail-page"
                id="trendDetailPage"
            >

                <div class="detail-topbar">

                    <button
                        class="back-button"
                        id="backButton"
                    >

                        <span>
                            ←
                        </span>

                        <span>
                            返回
                        </span>

                    </button>

                    <span class="detail-category">
                        INSIGHTS
                    </span>

                </div>


                <div class="detail-content">

                    <div class="detail-heading">

                        <div
                            class="detail-number"
                            id="detailNumber"
                        >
                            01
                        </div>

                        <h1 id="detailTitle">
                            2026趋势报告
                        </h1>

                    </div>


                    <div class="detail-divider"></div>


                    <div class="detail-grid">

                        <div
                            class="detail-visual"
                            id="detailVisual"
                        >
                        </div>


                        <div class="detail-text">

                            <div class="detail-label">
                                TREND INSIGHT
                            </div>

                            <p id="detailDescription">
                                探索正在塑造时尚创意行业的视觉趋势、
                                工作方式与审美变化。
                            </p>

                            <div class="detail-meta">

                                <span>
                                    行业洞察
                                </span>

                                <span>
                                    ·
                                </span>

                                <span>
                                    AI 分析
                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </main>


        <!-- =========================
             TOAST
        ========================== -->

        <div
            class="toast"
            id="toast"
        >
            搜索已更新
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
